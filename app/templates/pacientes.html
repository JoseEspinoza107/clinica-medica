<!DOCTYPE html>
<html>

<head>

    <title>Pacientes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a href="/" class="navbar-brand">
            CLINICA MEDICA
        </a>

    </div>

</nav>

<div class="container mt-4">

    <h1>Lista de Pacientes</h1>

    <form method="POST" action="/agregar_paciente">

        <div class="row">

            <div class="col-md-3">

                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    placeholder="Nombre"
                    required
                >

            </div>

            <div class="col-md-2">

                <input
                    type="number"
                    name="edad"
                    class="form-control"
                    placeholder="Edad"
                >

            </div>

            <div class="col-md-3">

                <input
                    type="text"
                    name="direccion"
                    class="form-control"
                    placeholder="Dirección"
                >

            </div>

            <div class="col-md-2">

                <input
                    type="text"
                    name="telefono"
                    class="form-control"
                    placeholder="Teléfono"
                >

            </div>

            <div class="col-md-2">

                <button class="btn btn-success w-100">
                    Guardar
                </button>

            </div>

        </div>

    </form>

    <hr>

    <table class="table table-striped table-bordered">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody>

            {% for paciente in pacientes %}

            <tr>

                <td>{{ paciente.id_paciente }}</td>
                <td>{{ paciente.nombre }}</td>
                <td>{{ paciente.edad }}</td>
                <td>{{ paciente.direccion }}</td>
                <td>{{ paciente.telefono }}</td>

                <td>

                    <a
                        href="/eliminar_paciente/{{ paciente.id_paciente }}"
                        class="btn btn-danger btn-sm"
                    >
                        Eliminar
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
