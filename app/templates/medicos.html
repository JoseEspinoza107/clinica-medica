<!DOCTYPE html>
<html>

<head>

    <title>Médicos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a href="/" class="navbar-brand">
            CLINICA MEDICA
        </a>

    </div>

</nav>

<div class="container mt-4">

    <h1>Lista de Médicos</h1>

    <form method="POST" action="/agregar_medico">

        <div class="row">

            <div class="col-md-3">

                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    placeholder="Nombre"
                    required
                >

            </div>

            <div class="col-md-2">

                <input
                    type="text"
                    name="especialidad"
                    class="form-control"
                    placeholder="Especialidad"
                >

            </div>

            <div class="col-md-2">

                <input
                    type="text"
                    name="telefono"
                    class="form-control"
                    placeholder="Teléfono"
                >

            </div>

            <div class="col-md-3">

                <input
                    type="email"
                    name="correo"
                    class="form-control"
                    placeholder="Correo"
                >

            </div>

            <div class="col-md-2">

                <button class="btn btn-success w-100">
                    Guardar
                </button>

            </div>

        </div>

    </form>

    <hr>

    <table class="table table-striped table-bordered">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody>

            {% for medico in medicos %}

            <tr>

                <td>{{ medico.id_medico }}</td>
                <td>{{ medico.nombre }}</td>
                <td>{{ medico.especialidad }}</td>
                <td>{{ medico.telefono }}</td>
                <td>{{ medico.correo }}</td>

                <td>

                    <a
                        href="/eliminar_medico/{{ medico.id_medico }}"
                        class="btn btn-danger btn-sm"
                    >
                        Eliminar
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
